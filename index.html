<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>하나의 바람으로 시작된, 우리의 바람</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?q=80&w=1920') no-repeat center center; background-size: cover; z-index: -2; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.4) 100%); pointer-events: none; z-index: 1; }
        .film-grain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://vignette.wikia.nocookie.net/creepypasta/images/8/80/Film_Grain.png/revision/latest?cb=20150914013401'); opacity: 0.04; pointer-events: none; z-index: 2; }
        .container { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .glass-box { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 50px 35px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2); width: 100%; max-width: 340px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { font-size: 22px; font-weight: 500; color: white; margin-bottom: 12px; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); word-break: keep-all; }
        .subtitle { font-size: 13.5px; color: rgba(255, 255, 255, 0.85); margin-top: 0; margin-bottom: 40px; font-weight: 300; line-height: 1.6; word-break: keep-all; }
        input, textarea { width: 100%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 14px; margin-bottom: 15px; color: white; outline: none; box-sizing: border-box; font-size: 14.5px; }
        button { width: 100%; padding: 16px; background: white; color: #2c3e50; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="bg"></div><div class="overlay"></div><div class="film-grain"></div>
    <div class="container">
        <div class="glass-box">
            <h1>하나의 바람으로 시작된, 우리의 바람.</h1>
            <p class="subtitle">학과 혹은 학생회에게<br>학우들의 바람을 적어주세요.</p>
            <input type="text" id="nick" placeholder="기억될 이름">
            <textarea id="msg" placeholder="여기에 당신의 마음을 담아주세요" rows="4"></textarea>
            <button onclick="saveWish()">바람 전달하기</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBAkeP6s7tipidK3BS2E4QejSRSNqjhllY",
  authDomain: "our-wish-2026.firebaseapp.com",
  databaseURL: "https://our-wish-2026-default-rtdb.firebaseio.com",
  projectId: "our-wish-2026",
  storageBucket: "our-wish-2026.firebasestorage.app",
  messagingSenderId: "614027160809",
  appId: "1:614027160809:web:8400fdd04bb34067ee5478",
  measurementId: "G-3SG4D9652W"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        const firebaseConfig = {
            apiKey: "본인의값",
            authDomain: "본인의값",
            databaseURL: "본인의값",
            projectId: "본인의값",
            storageBucket: "본인의값",
            messagingSenderId: "본인의값",
            appId: "본인의값"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function saveWish() {
            const nickname = document.getElementById('nick').value;
            const message = document.getElementById('msg').value;
            if(!nickname.trim() || !message.trim()) return alert("모두 입력해 주세요.");

            // 서버로 데이터 전송
            database.ref('wishes').push({
                nickname: nickname,
                message: message,
                date: new Date().toLocaleString()
            }).then(() => {
                alert("소중한 바람이 성공적으로 전달되었습니다.");
                location.reload();
            }).catch(e => alert("오류 발생: " + e.message));
        }
    </script>
</body>
</html>
