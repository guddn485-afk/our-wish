<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <title>하나의 바람으로 시작된, 우리의 바람</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?q=80&w=1920') no-repeat center center; background-size: cover; z-index: -2; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.4) 100%); pointer-events: none; z-index: 1; }
        .film-grain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://vignette.wikia.nocookie.net/creepypasta/images/8/80/Film_Grain.png/revision/latest?cb=20150914013401'); opacity: 0.04; pointer-events: none; z-index: 2; }
        .container { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        .glass-box { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 40px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { font-size: 22px; color: white; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); word-break: keep-all; font-weight: 600; }
        .subtitle { font-size: 14px; color: rgba(255, 255, 255, 0.9); margin-bottom: 30px; font-weight: 300; line-height: 1.5; word-break: keep-all; }
        input, textarea { width: 100%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px; color: white; outline: none; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 16px; background: white; color: #2c3e50; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
        @media screen and (max-width: 600px) {
            .glass-box { padding: 50px 30px; max-width: 95%; }
            h1 { font-size: 28px !important; }
            .subtitle { font-size: 18px !important; }
            input, textarea { padding: 22px !important; font-size: 18px !important; }
            button { padding: 22px !important; font-size: 20px !important; }
        }
    </style>
</head>
<body>
    <div class="bg"></div><div class="overlay"></div><div class="film-grain"></div>
    <div class="container">
        <div class="glass-box">
            <h1>하나의 바람으로 시작된, 우리의 바람.</h1>
            <p class="subtitle">학과 혹은 학생회에게<br>학우들의 바람을 적어주세요.</p>
            <input type="text" id="nick" placeholder="기억될 이름">
            <textarea id="msg" placeholder="여기에 당신의 마음을 담아주세요" rows="4"></textarea>
            
            <button type="button" onclick="saveWish()">바람 전달하기</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // -----------------------------------------------------------------
        // ⚠️ 주의: 이 아래로는 절대 'import'라는 단어를 사용하지 마세요!
        // -----------------------------------------------------------------

        // 2. 파이어베이스 설정값 채우기
        const firebaseConfig = {
            apiKey: "AIzaSyBAkeP6s7tipidK3BS2E4QejSRSNqjhllY",
  authDomain: "our-wish-2026.firebaseapp.com",
  databaseURL: "https://our-wish-2026-default-rtdb.firebaseio.com",
  projectId: "our-wish-2026",
  storageBucket: "our-wish-2026.firebasestorage.app",
  messagingSenderId: "614027160809",
  appId: "1:614027160809:web:8400fdd04bb34067ee5478",
  measurementId: "G-3SG4D9652W"
        };

        // 3. 초기화
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 4. 전송 함수 정의
        function saveWish() {
            console.log("전송 시도 시작...");

            const nickname = document.getElementById('nick').value;
            const message = document.getElementById('msg').value;

            if(!nickname.trim() || !message.trim()) {
                alert("내용을 입력해 주세요.");
                return;
            }

            // Realtime Database에 저장
            database.ref('wishes').push({
                nickname: nickname,
                message: message,
                date: new Date().toLocaleString()
            })
            .then(() => {
                alert("소중한 바람이 전달되었습니다.");
                location.reload();
            })
            .catch((error) => {
                console.error("Firebase Error:", error);
                alert("전송 실패: " + error.message);
            });
        }
    </script>
</body>
</html>
