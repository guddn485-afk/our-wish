<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바람의 기록들 - 관리자</title>
    <style>
        /* 배경: 너의 이름은 스타일의 블루 그라데이션 */
        body { 
            background: linear-gradient(180deg, #cfd9df 0%, #e2ebf0 100%); 
            font-family: -apple-system, sans-serif; 
            margin: 0; padding: 40px 20px; 
            min-height: 100vh; 
        }

        .admin-wrap { max-width: 600px; margin: 0 auto; }

        h1 { 
            font-size: 24px; text-align: center; color: #5a7a9a; 
            margin-bottom: 40px; font-weight: 500; letter-spacing: 1px;
        }

        /* 폴라로이드 스타일 카드 */
        .card { 
            background: white; padding: 25px; padding-bottom: 50px; 
            margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border-radius: 4px; position: relative; 
            transform: rotate(-0.5deg); transition: 0.3s;
        }
        .card:nth-child(even) { transform: rotate(1deg); }

        .sender { 
            font-weight: 700; color: #007aff; font-size: 16px; 
            display: block; margin-bottom: 12px; 
        }

        .message { 
            font-size: 18px; color: #333; line-height: 1.6; 
            word-break: break-all; white-space: pre-wrap;
        }

        /* 필름 날짜 스탬프 느낌 */
        .date { 
            position: absolute; bottom: 20px; right: 25px; 
            color: #ff8c00; font-family: 'Courier New', monospace; 
            font-size: 14px; font-weight: bold; opacity: 0.8; 
        }

        /* 삭제 버튼 (시원하게 키움) */
        .del-btn { 
            position: absolute; top: 15px; right: 15px; 
            background: rgba(255, 59, 48, 0.1); border: none; 
            color: #ff3b30; width: 40px; height: 40px; 
            border-radius: 50%; cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
        }

        .back-btn { 
            display: block; text-align: center; margin-top: 60px; 
            color: #888; text-decoration: none; font-size: 15px; 
        }

        /* 모바일 대응: 글씨 더 크게 */
        @media screen and (max-width: 600px) {
            h1 { font-size: 28px; }
            .message { font-size: 20px; }
            .sender { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="admin-wrap">
        <h1>도착한 바람들의 기록</h1>
        <div id="list"></div>
        <a href="index.html" class="back-btn">← 메인 화면으로 돌아가기</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // 🔴 형우님의 Firebase 설정을 똑같이 붙여넣으세요!
        const firebaseConfig = {
            apiKey: "...",
            authDomain: "...",
            databaseURL: "...",
            projectId: "...",
            storageBucket: "...",
            messagingSenderId: "...",
            appId: "..."
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 실시간 데이터 감시 및 화면 출력
        database.ref('wishes').on('value', (snapshot) => {
            const listArea = document.getElementById('list');
            const data = snapshot.val();
            
            if(!data) {
                listArea.innerHTML = "<p style='text-align:center; color:#999; font-size:18px;'>아직 기록이 없습니다.</p>";
                return;
            }

            // 데이터를 배열로 바꿔서 최신순으로 정렬
            const items = Object.entries(data).reverse(); 
            
            listArea.innerHTML = items.map(([key, item]) => `
                <div class="card">
                    <span class="sender">From: ${item.nickname}</span>
                    <div class="message">${item.message}</div>
                    <div class="date">${item.date}</div>
                    <button class="del-btn" onclick="removeWish('${key}')">×</button>
                </div>
            `).join('');
        });

        // 삭제 함수
        function removeWish(key) {
            if(confirm("이 소중한 기록을 삭제하시겠습니까?")) {
                database.ref('wishes/' + key).remove()
                .then(() => alert("삭제되었습니다."))
                .catch((e) => alert("삭제 실패: " + e.message));
            }
        }
    </script>
</body>
</html>
