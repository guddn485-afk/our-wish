<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 인증 - 바람의 기록들</title>
    <style>
        /* 보안을 위해 인증 전에는 화면을 숨깁니다 */
        #admin-content { display: none; }
        
        body { background: linear-gradient(180deg, #cfd9df 0%, #e2ebf0 100%); font-family: -apple-system, sans-serif; margin: 0; padding: 40px 20px; min-height: 100vh; }
        .admin-wrap { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; text-align: center; color: #5a7a9a; margin-bottom: 30px; font-weight: 500; }
        
        .dashboard { background: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-around; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .dash-item { text-align: center; }
        .dash-item span { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .dash-item b { font-size: 22px; color: #007aff; }

        .card { background: white; padding: 25px; padding-bottom: 50px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-radius: 8px; position: relative; }
        .sender { font-weight: 700; color: #007aff; font-size: 15px; display: block; margin-bottom: 10px; }
        .message { font-size: 17px; color: #333; line-height: 1.6; word-break: break-all; white-space: pre-wrap; }
        .date { position: absolute; bottom: 20px; right: 25px; color: #ff8c00; font-family: monospace; font-size: 13px; font-weight: bold; opacity: 0.7; }
        .del-btn { position: absolute; top: 15px; right: 15px; background: #fff1f1; border: none; color: #ff3b30; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="admin-content" class="admin-wrap">
        <h1>도착한 바람들의 기록</h1>
        
        <div class="dashboard">
            <div class="dash-item"><span>총 방문자</span><b id="v-count">0</b></div>
            <div class="dash-item"><span>모인 바람</span><b id="w-count">0</b></div>
        </div>

        <div id="list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // 🔒 1. 비밀번호 체크 로직 (접속하자마자 실행)
        const MY_PASSWORD = "wish2026"; // 🔴 여기에 원하는 비밀번호를 쓰세요!
        const userInput = prompt("관리자 비밀번호를 입력하세요.");

        if (userInput === MY_PASSWORD) {
            // 비밀번호가 맞으면 화면을 보여줌
            document.getElementById('admin-content').style.display = 'block';
        } else {
            // 틀리면 메인 페이지로 강제 이동
            alert("비밀번호가 틀렸습니다.");
            window.location.href = "index.html";
        }

        // 2. 파이어베이스 설정 (비밀번호 통과 후에만 작동)
        const firebaseConfig = {
            apiKey: "AIzaSyBAkeP6s7tipidK3BS2E4QejSRSNqjhllY",
  authDomain: "our-wish-2026.firebaseapp.com",
  databaseURL: "https://our-wish-2026-default-rtdb.firebaseio.com",
  projectId: "our-wish-2026",
  storageBucket: "our-wish-2026.firebasestorage.app",
  messagingSenderId: "614027160809",
  appId: "1:614027160809:web:8400fdd04bb34067ee5478",
  measurementId: "G-3SG4D9652W"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 방문자 수 및 목록 불러오기 (기존과 동일)
        database.ref('stats/visitorCount').on('value', s => document.getElementById('v-count').innerText = s.val() || 0);
        database.ref('wishes').on('value', (snapshot) => {
            const listArea = document.getElementById('list');
            const data = snapshot.val();
            document.getElementById('w-count').innerText = snapshot.numChildren();
            
            if(!data) {
                listArea.innerHTML = "<p style='text-align:center; color:#999;'>기록이 없습니다.</p>";
                return;
            }

            const items = Object.entries(data).reverse(); 
            listArea.innerHTML = items.map(([key, item]) => `
                <div class="card">
                    <span class="sender">From: ${item.nickname}</span>
                    <div class="message">${item.message}</div>
                    <div class="date">${item.date}</div>
                    <button class="del-btn" onclick="removeWish('${key}')">×</button>
                </div>
            `).join('');
        });

        function removeWish(key) {
            if(confirm("삭제하시겠습니까?")) {
                database.ref('wishes/' + key).remove();
            }
        }
    </script>
</body>
</html>
