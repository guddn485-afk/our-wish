<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>바람의 기록들</title>
    <style>
        body {
            background: #f4f4f4;
            font-family: -apple-system, sans-serif;
            padding: 40px 20px;
            margin: 0;
            background: linear-gradient(to bottom, #d9e7ff, #ffffff);
            min-height: 100vh;
        }
        .admin-container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 18px;
            font-weight: 400;
            text-align: center;
            color: #4a6a8a;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .photo-card {
            background: white;
            padding: 20px;
            padding-bottom: 40px; /* 폴라로이드 느낌 */
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 2px;
            position: relative;
            transform: rotate(-1deg); /* 살짝 기울여서 자연스럽게 */
        }
        .photo-card:nth-child(even) { transform: rotate(1.5deg); }
        
        .sender {
            font-weight: 600;
            color: #007aff;
            font-size: 13px;
            margin-bottom: 10px;
            display: block;
        }
        .msg {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
        }
        /* 필름 날짜 스탬프 느낌 */
        .date-stamp {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: #ff8c00; /* 오렌지색 날짜 도장 */
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            opacity: 0.8;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 10px;
        }
        .delete-btn:hover { color: #ff3b30; }
        .back-link { display: block; text-align: center; margin-top: 50px; color: #888; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>모아진 바람의 기록</h1>
        <div id="list"></div>
        <a href="index.html" class="back-link">돌아가기</a>
    </div>

    <script>
        function load() {
            const area = document.getElementById('list');
            const data = JSON.parse(localStorage.getItem('wish_data') || '[]');

            if(data.length === 0) {
                area.innerHTML = "<p style='text-align:center; color:#999;'>아직 기록이 없습니다.</p>";
                return;
            }

            area.innerHTML = data.reverse().map((item, idx) => `
                <div class="photo-card">
                    <span class="sender">${item.nickname}</span>
                    <div class="msg">${item.message}</div>
                    <div class="date-stamp">'${item.date.split('.').join(' ')}</div>
                    <button class="delete-btn" onclick="remove(${data.length - 1 - idx})">삭제</button>
                </div>
            `).join('');
        }

        function remove(idx) {
            if(!confirm("이 기록을 지우시겠습니까?")) return;
            let data = JSON.parse(localStorage.getItem('wish_data') || '[]');
            data.splice(idx, 1);
            localStorage.setItem('wish_data', JSON.stringify(data));
            load();
        }
        window.onload = load;
    </script>
</body>
</html>
